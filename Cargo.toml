[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

# Stack versions checked on crates.io on 2026-10-10 (see docs/design/M00-fondations.md).
# Crates only pull a dependency from this table when they actually use it.
[workspace.dependencies]
# Internal crates
patine_core = { path = "crates/patine_core" }
patine_mesh = { path = "crates/patine_mesh" }
patine_gpu = { path = "crates/patine_gpu" }
patine_render = { path = "crates/patine_render" }
patine_compositor = { path = "crates/patine_compositor" }
patine_procedural = { path = "crates/patine_procedural" }
patine_paint = { path = "crates/patine_paint" }
patine_bake = { path = "crates/patine_bake" }
patine_export = { path = "crates/patine_export" }
patine_assets = { path = "crates/patine_assets" }

# GPU, windowing, UI
wgpu = "30.0.1"
naga = "30.0.1"
winit = "0.30.13"
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
egui_dock = "0.21.1"
egui-phosphor = "0.14.0"
rfd = "0.17.2"
octotablet = "0.1.0"

# Math, meshes, images
glam = "0.34.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
# Without image decoding of its own: only buffers are imported.
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils"] }
ufbx = "0.11.5"
bevy_mikktspace = "1.0.0"
image = { version = "0.25.10", default-features = false }
exr = "1.74.2"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
postcard = { version = "1.1.3", features = ["use-std"] }
zstd = "0.14.2"
zip = { version = "9.0.1", default-features = false }

# Infrastructure
rayon = "1.12.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
puffin = "0.20.0"
puffin_http = "0.17.0"
pollster = "1.0.1"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = "0.9.6"
sys-locale = "0.3.2"

# Tests and benchmarks
proptest = "1.11.0"
criterion = "0.8.2"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Shader-heavy GPU code and image loops are unusably slow at opt-level 0.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
