[package]
name = "patine_app"
description = "Patine desktop application: egui interface, tools and shortcuts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Reload WGSL shaders from disk instead of using the embedded copies.
hot-reload = ["patine_gpu/hot-reload"]
# Installed builds on Windows: no console window; fatal errors show in a dialog.
windows-gui = []

[dependencies]
patine_core.workspace = true
patine_mesh.workspace = true
patine_gpu.workspace = true
patine_render.workspace = true
patine_compositor.workspace = true
patine_procedural.workspace = true
patine_paint.workspace = true
patine_bake.workspace = true
patine_export.workspace = true
patine_assets.workspace = true
anyhow.workspace = true
glam.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
puffin.workspace = true
puffin_http.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
egui_dock.workspace = true
egui-phosphor.workspace = true
octotablet.workspace = true
winit.workspace = true
pollster.workspace = true
rfd.workspace = true
image = { workspace = true, features = ["png"] }
ron.workspace = true
serde.workspace = true
fluent-bundle.workspace = true
fluent-syntax.workspace = true
unic-langid.workspace = true
sys-locale.workspace = true

[lints]
workspace = true
