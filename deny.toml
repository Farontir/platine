# cargo-deny configuration: `cargo deny check`.
# Every license or exception added here must be justified by a comment.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # bincode is unmaintained (no vulnerability). It only reaches us through puffin, which
    # encodes its profiler frames with it for puffin_http. Patine's own formats never use
    # it (see the bincode ban below). Revisit when puffin drops it.
    { id = "RUSTSEC-2025-0141", reason = "bincode only used by the opt-in puffin profiler" },
    # Unmaintained, no vulnerability: compile-time proc-macro used by egui_dock.
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro of egui_dock" },
    # Unmaintained, no vulnerability: font parser of egui's text stack (ab_glyph). Only
    # parses the fonts embedded in the binary. Revisit with the next egui release.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser only parses egui's embedded fonts" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    # ISC is functionally identical to MIT (libloading, through wgpu-hal).
    "ISC",
    # Boost Software License: permissive, no attribution required in binaries
    # (clipboard-win and error-code, through egui-winit's clipboard support).
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    # Unicode data tables shipped by the ICU crates (unicode-ident, icu_*): permissive.
    "Unicode-3.0",
]
exceptions = [
    # egui's default fonts (Ubuntu-Light, NotoEmoji, emoji-icon-font). Both licenses
    # allow commercial redistribution of the embedded fonts. Restricted to this crate.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Architecture rule: GPU and UI crates may only be direct dependencies of the crates
# listed in `wrappers`. In particular, patine_core never depends on wgpu, egui or winit.
deny = [
    { crate = "wgpu", wrappers = [
        "patine_gpu",
        "patine_render",
        "patine_compositor",
        "patine_procedural",
        "patine_paint",
        "patine_bake",
        "patine_export",
        "patine_assets",
        "patine_app",
        "patine_cli",
        "egui-wgpu",
    ] },
    { crate = "egui", wrappers = [
        "patine_app",
        "egui-wgpu",
        "egui-winit",
        "egui_dock",
        "egui-phosphor",
    ] },
    { crate = "winit", wrappers = ["patine_app", "egui-winit"] },
    # Unmaintained (3.0 is a compile_error! tombstone). Never used by Patine's own
    # formats (postcard is); tolerated only as puffin's internal frame encoding.
    { crate = "bincode", wrappers = ["puffin"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
