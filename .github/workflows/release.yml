name: Release

# A tag vX.Y.Z builds the Windows installer, a portable Windows archive and a Linux
# archive, then publishes them as a GitHub release whose notes are
# docs/release-notes/vX.Y.Z.md. Run by hand (workflow_dispatch), it only builds: the
# files are kept as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: cargo build --release --locked -p patine_app -p patine_cli --features patine_app/windows-gui
      # wgpu compiles shaders for DirectX 12 with dxcompiler.dll when it sits beside the
      # executable, and falls back to FXC otherwise: FXC freezes the application for a
      # minute or more on the first frames (white window on GPUs without Vulkan). Only
      # dxcompiler.dll is shipped (open source, NCSA and MIT); dxil.dll is not needed.
      # The archive stores its paths with backslashes: unzip warns and exits with 1, so it is
      # expanded with PowerShell.
      - name: DirectX shader compiler
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$env:DXC_VERSION/dxc_2026_09_29.zip" -OutFile dxc.zip
          $hash = (Get-FileHash dxc.zip -Algorithm SHA256).Hash
          if ($hash -ne $env:DXC_SHA256) { Write-Error "dxc.zip: SHA-256 $hash, expected $env:DXC_SHA256"; exit 1 }
          Expand-Archive dxc.zip -DestinationPath dxc
          if (-not (Test-Path dxc\bin\x64\dxcompiler.dll)) { Write-Error "dxcompiler.dll missing from the archive"; exit 1 }
        env:
          DXC_VERSION: v1.9.2609
          DXC_SHA256: ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1
      - name: Stage
        shell: bash
        run: |
          stage=dist/Patine
          mkdir -p "$stage"
          cp target/release/patine_app.exe target/release/patine_cli.exe "$stage/"
          cp dxc/bin/x64/dxcompiler.dll "$stage/"
          cp -r assets "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          python scripts/release/third_party_licenses.py --target x86_64-pc-windows-msvc --out "$stage/THIRD-PARTY-LICENSES.txt" \
            --component "DirectX Shader Compiler v1.9.2609 (dxcompiler.dll), https://github.com/microsoft/DirectXShaderCompiler" \
            dxc/LICENSE-LLVM.txt dxc/LICENCE-MIT.txt
      - name: Check that the application starts
        shell: bash
        run: dist/Patine/patine_cli.exe --version
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceDir=$PWD\dist\Patine" "/DOutputDir=$PWD\dist" installer\patine.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable archive
        shell: pwsh
        run: Compress-Archive -Path dist\Patine -DestinationPath "dist\Patine-${{ steps.version.outputs.version }}-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    # The oldest supported image: the binaries run on more distributions (glibc).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install windowing libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p patine_app -p patine_cli
      - name: Archive
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="patine-$version-linux-x64"
          stage="dist/$name"
          mkdir -p "$stage"
          cp target/release/patine_app target/release/patine_cli "$stage/"
          cp -r assets "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          python3 scripts/release/third_party_licenses.py --target x86_64-unknown-linux-gnu --out "$stage/THIRD-PARTY-LICENSES.txt"
          "$stage/patine_cli" --version
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "missing $notes" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Patine ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" \
            --prerelease
